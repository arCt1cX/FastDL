name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath FastDL.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FastDL
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" FastDL.zip `
            --title "FastDL ${{ github.ref_name }}" `
            --notes "Extract the zip, double-click Installa.cmd, then load the extension folder in chrome://extensions. See README."
